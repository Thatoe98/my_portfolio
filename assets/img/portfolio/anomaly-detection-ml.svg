<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191c"/>
      <stop offset="1" stop-color="#1f2428"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgC)"/>

  <g font-family="Arial" font-size="24" font-weight="700" fill="#E5E7EB">
    <text x="60" y="70">Unsupervised Anomaly Detection</text>
  </g>
  <g font-family="Arial" font-size="16" fill="#9aa4ab">
    <text x="60" y="96">2,512 bank transactions · K-Means · DBSCAN · Isolation Forest</text>
  </g>

  <!-- plot axes -->
  <g stroke="#3a4248" stroke-width="2">
    <line x1="130" y1="640" x2="1080" y2="640"/>
    <line x1="130" y1="150" x2="130" y2="640"/>
  </g>
  <text x="560" y="690" fill="#9aa4ab" font-family="Arial" font-size="15">amount-to-balance ratio</text>
  <text x="70" y="400" fill="#9aa4ab" font-family="Arial" font-size="15" transform="rotate(-90 70 400)">transaction frequency</text>

  <!-- normal cluster points -->
  <g fill="#4FD1C5" opacity="0.75">
    <circle cx="300" cy="500" r="7"/><circle cx="330" cy="480" r="7"/><circle cx="360" cy="520" r="7"/>
    <circle cx="310" cy="450" r="7"/><circle cx="380" cy="470" r="7"/><circle cx="340" cy="540" r="7"/>
    <circle cx="420" cy="500" r="7"/><circle cx="290" cy="540" r="7"/><circle cx="400" cy="440" r="7"/>
    <circle cx="450" cy="470" r="7"/><circle cx="470" cy="520" r="7"/><circle cx="320" cy="580" r="7"/>
    <circle cx="500" cy="490" r="7"/><circle cx="480" cy="560" r="7"/><circle cx="350" cy="430" r="7"/>
    <circle cx="430" cy="580" r="7"/><circle cx="260" cy="470" r="7"/><circle cx="390" cy="590" r="7"/>
    <circle cx="520" cy="540" r="7"/><circle cx="270" cy="510" r="7"/>
  </g>

  <!-- second normal cluster -->
  <g fill="#4FD1C5" opacity="0.6">
    <circle cx="700" cy="300" r="7"/><circle cx="730" cy="280" r="7"/><circle cx="760" cy="320" r="7"/>
    <circle cx="710" cy="250" r="7"/><circle cx="780" cy="270" r="7"/><circle cx="740" cy="340" r="7"/>
    <circle cx="820" cy="300" r="7"/><circle cx="690" cy="340" r="7"/><circle cx="800" cy="240" r="7"/>
    <circle cx="850" cy="270" r="7"/><circle cx="650" cy="310" r="7"/><circle cx="870" cy="320" r="7"/>
  </g>

  <!-- outliers flagged -->
  <g>
    <circle cx="950" cy="580" r="10" fill="#F59E0B"/>
    <circle cx="950" cy="580" r="20" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
    <circle cx="600" cy="620" r="10" fill="#F59E0B"/>
    <circle cx="600" cy="620" r="20" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
    <circle cx="1000" cy="200" r="10" fill="#F59E0B"/>
    <circle cx="1000" cy="200" r="20" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
    <circle cx="200" cy="230" r="10" fill="#F59E0B"/>
    <circle cx="200" cy="230" r="20" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- legend -->
  <g font-family="Arial" font-size="15" fill="#E5E7EB">
    <circle cx="890" cy="170" r="7" fill="#4FD1C5"/>
    <text x="905" y="175">normal</text>
    <circle cx="990" cy="170" r="7" fill="#F59E0B"/>
    <text x="1005" y="175">flagged</text>
  </g>

  <g font-family="Arial" font-size="15" font-weight="600">
    <rect x="130" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="150" y="690" fill="#4FD1C5">scikit-learn</text>

    <rect x="254" y="668" width="100" height="34" rx="17" fill="#232c30"/>
    <text x="272" y="690" fill="#4FD1C5">pandas</text>

    <rect x="368" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="386" y="690" fill="#4FD1C5">Seaborn</text>
  </g>
</svg>
