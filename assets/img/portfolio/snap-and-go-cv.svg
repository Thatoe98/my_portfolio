<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191c"/>
      <stop offset="1" stop-color="#1f2428"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgA)"/>

  <!-- subtle grid -->
  <g stroke="#2a3138" stroke-width="1">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200 M0 600 H1200"/>
    <path d="M150 0 V750 M300 0 V750 M450 0 V750 M600 0 V750 M750 0 V750 M900 0 V750 M1050 0 V750"/>
  </g>

  <!-- camera frame -->
  <rect x="120" y="110" width="960" height="530" rx="18" fill="#1a2024" stroke="#3a4248" stroke-width="2"/>

  <!-- product items as rounded rects -->
  <g>
    <rect x="190" y="330" width="150" height="190" rx="10" fill="#2a3338" stroke="#4FD1C5" stroke-width="2.5"/>
    <text x="195" y="322" fill="#4FD1C5" font-family="Arial" font-size="20" font-weight="700">milk_1l 0.94</text>

    <rect x="400" y="260" width="130" height="260" rx="65" fill="#2a3338" stroke="#4FD1C5" stroke-width="2.5"/>
    <text x="405" y="252" fill="#4FD1C5" font-family="Arial" font-size="20" font-weight="700">bottle_water 0.89</text>

    <rect x="590" y="380" width="200" height="140" rx="10" fill="#2a3338" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="595" y="372" fill="#F59E0B" font-family="Arial" font-size="20" font-weight="700">cereal_box 0.81</text>

    <circle cx="920" cy="460" r="80" fill="#2a3338" stroke="#4FD1C5" stroke-width="2.5"/>
    <text x="855" y="368" fill="#4FD1C5" font-family="Arial" font-size="20" font-weight="700">apple 0.92</text>
  </g>

  <!-- scan line -->
  <rect x="120" y="258" width="960" height="3" fill="#4FD1C5" opacity="0.8"/>

  <!-- top bar: pipeline labels -->
  <g font-family="Arial" font-size="24" font-weight="700" fill="#E5E7EB">
    <text x="150" y="70">Snap &amp; Go</text>
  </g>
  <g font-family="Arial" font-size="16" fill="#9aa4ab">
    <text x="150" y="96">YOLOv8n · Roboflow dataset · FastAPI inference · PromptPay slip verification</text>
  </g>

  <!-- bottom chips -->
  <g font-family="Arial" font-size="15" font-weight="600">
    <rect x="120" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="140" y="690" fill="#4FD1C5">PyTorch</text>

    <rect x="244" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="264" y="690" fill="#4FD1C5">OpenCV</text>

    <rect x="368" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="386" y="690" fill="#4FD1C5">FastAPI</text>

    <rect x="492" y="668" width="130" height="34" rx="17" fill="#232c30"/>
    <text x="510" y="690" fill="#4FD1C5">Supabase</text>

    <rect x="636" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="654" y="690" fill="#4FD1C5">Next.js</text>
  </g>
</svg>
