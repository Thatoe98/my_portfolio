<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191c"/>
      <stop offset="1" stop-color="#1f2428"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgB)"/>

  <g font-family="Arial" font-size="24" font-weight="700" fill="#E5E7EB">
    <text x="60" y="70">Face Recognition System</text>
  </g>
  <g font-family="Arial" font-size="16" fill="#9aa4ab">
    <text x="60" y="96">Facenet512 embeddings · 105 identities · cosine similarity · Flask API</text>
  </g>

  <!-- query face -->
  <g transform="translate(90,150)">
    <rect width="230" height="280" rx="16" fill="#1a2024" stroke="#3a4248" stroke-width="2"/>
    <circle cx="115" cy="110" r="55" fill="none" stroke="#4FD1C5" stroke-width="3"/>
    <circle cx="95" cy="98" r="5" fill="#4FD1C5"/>
    <circle cx="135" cy="98" r="5" fill="#4FD1C5"/>
    <path d="M90 130 Q115 148 140 130" stroke="#4FD1C5" stroke-width="3" fill="none"/>
    <rect x="30" y="210" width="170" height="14" rx="7" fill="#2a3338"/>
    <text x="115" y="255" fill="#E5E7EB" font-family="Arial" font-size="16" text-anchor="middle">query image</text>
  </g>

  <!-- arrow to embedding vector -->
  <g stroke="#4FD1C5" stroke-width="2.5" fill="none">
    <line x1="330" y1="290" x2="420" y2="290" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4FD1C5"/>
    </marker>
  </defs>

  <!-- 512-d embedding bars -->
  <g transform="translate(440,160)">
    <text x="0" y="-12" fill="#E5E7EB" font-family="Arial" font-size="16" font-weight="700">512-d embedding</text>
    <g>
      <rect x="0" y="0" width="14" height="60" fill="#4FD1C5"/>
      <rect x="20" y="20" width="14" height="40" fill="#4FD1C5" opacity="0.8"/>
      <rect x="40" y="5" width="14" height="55" fill="#4FD1C5" opacity="0.6"/>
      <rect x="60" y="30" width="14" height="30" fill="#4FD1C5" opacity="0.9"/>
      <rect x="80" y="12" width="14" height="48" fill="#4FD1C5" opacity="0.5"/>
      <rect x="100" y="24" width="14" height="36" fill="#4FD1C5" opacity="0.75"/>
      <rect x="120" y="0" width="14" height="60" fill="#4FD1C5" opacity="0.4"/>
      <rect x="140" y="18" width="14" height="42" fill="#4FD1C5" opacity="0.85"/>
      <rect x="160" y="8" width="14" height="52" fill="#4FD1C5" opacity="0.6"/>
      <rect x="180" y="26" width="14" height="34" fill="#4FD1C5" opacity="0.7"/>
    </g>
  </g>

  <!-- cosine distance arrow -->
  <g stroke="#9aa4ab" stroke-width="2" fill="none" stroke-dasharray="4 4">
    <line x1="650" y1="200" x2="760" y2="200" marker-end="url(#arrow2)"/>
  </g>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9aa4ab"/>
    </marker>
  </defs>
  <text x="655" y="188" fill="#9aa4ab" font-family="Arial" font-size="14">cosine distance &lt; 0.4</text>

  <!-- top-5 match grid -->
  <g transform="translate(780,140)">
    <text x="0" y="-10" fill="#E5E7EB" font-family="Arial" font-size="16" font-weight="700">top-5 matches</text>
    <g font-family="Arial" font-size="14" fill="#E5E7EB">
      <!-- row 1: best match highlighted -->
      <rect x="0" y="0" width="340" height="56" rx="10" fill="#1d2b2a" stroke="#4FD1C5" stroke-width="2"/>
      <circle cx="30" cy="28" r="18" fill="#2a3338" stroke="#4FD1C5" stroke-width="2"/>
      <text x="60" y="24" font-weight="700">identity_041</text>
      <text x="60" y="42" fill="#4FD1C5">similarity 0.93</text>

      <rect x="0" y="66" width="340" height="44" rx="10" fill="#1a2024" stroke="#2a3338" stroke-width="2"/>
      <circle cx="30" cy="88" r="14" fill="#2a3338" stroke="#555" stroke-width="2"/>
      <text x="60" y="93" fill="#9aa4ab">identity_018 · 0.71</text>

      <rect x="0" y="118" width="340" height="44" rx="10" fill="#1a2024" stroke="#2a3338" stroke-width="2"/>
      <circle cx="30" cy="140" r="14" fill="#2a3338" stroke="#555" stroke-width="2"/>
      <text x="60" y="145" fill="#9aa4ab">identity_073 · 0.66</text>

      <rect x="0" y="170" width="340" height="44" rx="10" fill="#1a2024" stroke="#2a3338" stroke-width="2"/>
      <circle cx="30" cy="192" r="14" fill="#2a3338" stroke="#555" stroke-width="2"/>
      <text x="60" y="197" fill="#9aa4ab">identity_005 · 0.58</text>
    </g>
  </g>

  <g font-family="Arial" font-size="15" font-weight="600">
    <rect x="90" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="110" y="690" fill="#4FD1C5">DeepFace</text>

    <rect x="214" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="232" y="690" fill="#4FD1C5">TensorFlow</text>

    <rect x="338" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="356" y="690" fill="#4FD1C5">OpenCV</text>

    <rect x="462" y="668" width="100" height="34" rx="17" fill="#232c30"/>
    <text x="480" y="690" fill="#4FD1C5">Flask</text>
  </g>
</svg>
