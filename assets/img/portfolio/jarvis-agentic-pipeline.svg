<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191c"/>
      <stop offset="1" stop-color="#1f2428"/>
    </linearGradient>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4FD1C5"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="url(#bgD)"/>

  <g font-family="Arial" font-size="24" font-weight="700" fill="#E5E7EB">
    <text x="60" y="70">Jarvis — Agentic Content Pipeline</text>
  </g>
  <g font-family="Arial" font-size="16" fill="#9aa4ab">
    <text x="60" y="96">Telegram brief → bilingual caption + image → human approval → publish</text>
  </g>

  <!-- node 1: telegram -->
  <g transform="translate(60,220)">
    <rect width="190" height="120" rx="16" fill="#1a2024" stroke="#3a4248" stroke-width="2"/>
    <circle cx="40" cy="40" r="18" fill="#232c30" stroke="#4FD1C5" stroke-width="2"/>
    <path d="M31 40 L48 32 L42 48 Z" fill="#4FD1C5"/>
    <text x="70" y="36" fill="#E5E7EB" font-family="Arial" font-size="16" font-weight="700">Telegram</text>
    <text x="20" y="80" fill="#9aa4ab" font-family="Arial" font-size="13">voice or text</text>
    <text x="20" y="98" fill="#9aa4ab" font-family="Arial" font-size="13">brief from operator</text>
  </g>
  <line x1="250" y1="280" x2="315" y2="280" stroke="#4FD1C5" stroke-width="2.5" marker-end="url(#arrowD)"/>

  <!-- node 2: content agent + pgvector -->
  <g transform="translate(320,190)">
    <rect width="230" height="180" rx="16" fill="#1a2024" stroke="#3a4248" stroke-width="2"/>
    <text x="20" y="36" fill="#E5E7EB" font-family="Arial" font-size="16" font-weight="700">Content Agent</text>
    <text x="20" y="60" fill="#9aa4ab" font-family="Arial" font-size="13">LiteLLM → Gemini</text>
    <rect x="20" y="80" width="190" height="34" rx="8" fill="#232c30"/>
    <text x="30" y="102" fill="#4FD1C5" font-family="Arial" font-size="13">pgvector knowledge base</text>
    <text x="20" y="140" fill="#9aa4ab" font-family="Arial" font-size="13">retrieves menu/price/brand</text>
    <text x="20" y="158" fill="#9aa4ab" font-family="Arial" font-size="13">context before writing</text>
  </g>
  <line x1="550" y1="280" x2="615" y2="280" stroke="#4FD1C5" stroke-width="2.5" marker-end="url(#arrowD)"/>

  <!-- node 3: outputs caption + image -->
  <g transform="translate(620,150)">
    <rect width="230" height="110" rx="14" fill="#1a2024" stroke="#3a4248" stroke-width="2"/>
    <text x="18" y="32" fill="#E5E7EB" font-family="Arial" font-size="15" font-weight="700">Caption 🇲🇲 / 🇬🇧</text>
    <rect x="18" y="46" width="194" height="10" rx="5" fill="#2a3338"/>
    <rect x="18" y="64" width="150" height="10" rx="5" fill="#2a3338"/>
    <rect x="18" y="82" width="170" height="10" rx="5" fill="#2a3338"/>
  </g>
  <g transform="translate(620,280)">
    <rect width="230" height="110" rx="14" fill="#1a2024" stroke="#3a4248" stroke-width="2"/>
    <text x="18" y="30" fill="#E5E7EB" font-family="Arial" font-size="15" font-weight="700">Image Agent</text>
    <rect x="18" y="44" width="194" height="52" rx="8" fill="#232c30" stroke="#4FD1C5" stroke-width="1.5"/>
    <circle cx="48" cy="70" r="10" fill="#4FD1C5" opacity="0.7"/>
    <path d="M30 96 L70 60 L110 96 Z" fill="#4FD1C5" opacity="0.5"/>
  </g>
  <line x1="850" y1="280" x2="915" y2="280" stroke="#4FD1C5" stroke-width="2.5" marker-end="url(#arrowD)"/>

  <!-- node 4: human approval -->
  <g transform="translate(920,190)">
    <rect width="220" height="180" rx="16" fill="#1a2024" stroke="#4FD1C5" stroke-width="2"/>
    <text x="18" y="34" fill="#E5E7EB" font-family="Arial" font-size="16" font-weight="700">Human Approval</text>
    <rect x="18" y="56" width="90" height="36" rx="18" fill="#1d2b2a" stroke="#4FD1C5" stroke-width="1.5"/>
    <text x="34" y="80" fill="#4FD1C5" font-family="Arial" font-size="14">Approve</text>
    <rect x="118" y="56" width="84" height="36" rx="18" fill="#232c30"/>
    <text x="132" y="80" fill="#9aa4ab" font-family="Arial" font-size="14">Revise</text>
    <text x="18" y="130" fill="#9aa4ab" font-family="Arial" font-size="13">nothing publishes</text>
    <text x="18" y="148" fill="#9aa4ab" font-family="Arial" font-size="13">without an explicit tap</text>
  </g>

  <!-- publish arrow down -->
  <path d="M1030 370 V 420 Q1030 440 1010 440 H 200" stroke="#4FD1C5" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrowD)"/>
  <text x="400" y="430" fill="#9aa4ab" font-family="Arial" font-size="14">Facebook Graph API publish</text>

  <g font-family="Arial" font-size="15" font-weight="600">
    <rect x="60" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="78" y="690" fill="#4FD1C5">FastAPI</text>

    <rect x="184" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="200" y="690" fill="#4FD1C5">LiteLLM</text>

    <rect x="308" y="668" width="100" height="34" rx="17" fill="#232c30"/>
    <text x="325" y="690" fill="#4FD1C5">Gemini</text>

    <rect x="422" y="668" width="130" height="34" rx="17" fill="#232c30"/>
    <text x="438" y="690" fill="#4FD1C5">pgvector</text>

    <rect x="566" y="668" width="100" height="34" rx="17" fill="#232c30"/>
    <text x="584" y="690" fill="#4FD1C5">Docker</text>
  </g>
</svg>
