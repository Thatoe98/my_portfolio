<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191c"/>
      <stop offset="1" stop-color="#1f2428"/>
    </linearGradient>
    <marker id="arrowE" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4FD1C5"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="url(#bgE)"/>

  <g font-family="Arial" font-size="24" font-weight="700" fill="#E5E7EB">
    <text x="60" y="70">RAG Customer-Support Agent</text>
  </g>
  <g font-family="Arial" font-size="16" fill="#9aa4ab">
    <text x="60" y="96">Messenger → Gemini + RAG → confident answer, or human handoff on Telegram</text>
  </g>

  <!-- customer chat bubble -->
  <g transform="translate(70,160)">
    <rect width="260" height="90" rx="18" fill="#232c30"/>
    <text x="20" y="38" fill="#E5E7EB" font-family="Arial" font-size="14">"What are the tuition fees</text>
    <text x="20" y="58" fill="#E5E7EB" font-family="Arial" font-size="14">for the January intake?"</text>
  </g>
  <line x1="200" y1="250" x2="200" y2="300" stroke="#4FD1C5" stroke-width="2.5" marker-end="url(#arrowE)"/>

  <!-- RAG box -->
  <g transform="translate(70,310)">
    <rect width="260" height="160" rx="16" fill="#1a2024" stroke="#3a4248" stroke-width="2"/>
    <text x="20" y="34" fill="#E5E7EB" font-family="Arial" font-size="16" font-weight="700">RAG Pipeline</text>
    <rect x="20" y="50" width="90" height="70" rx="6" fill="#232c30"/>
    <rect x="30" y="60" width="70" height="8" rx="3" fill="#4FD1C5" opacity="0.7"/>
    <rect x="30" y="74" width="70" height="8" rx="3" fill="#4FD1C5" opacity="0.5"/>
    <rect x="30" y="88" width="70" height="8" rx="3" fill="#4FD1C5" opacity="0.6"/>
    <rect x="30" y="102" width="70" height="8" rx="3" fill="#4FD1C5" opacity="0.4"/>
    <text x="20" y="138" fill="#9aa4ab" font-family="Arial" font-size="12">embed → cosine search</text>
    <text x="20" y="154" fill="#9aa4ab" font-family="Arial" font-size="12">top-k chunks → Gemini</text>
  </g>

  <!-- branch arrows -->
  <path d="M330 390 H 430" stroke="#4FD1C5" stroke-width="2.5" fill="none" marker-end="url(#arrowE)"/>
  <text x="340" y="378" fill="#9aa4ab" font-family="Arial" font-size="13">confident</text>

  <!-- answer bubble -->
  <g transform="translate(440,330)">
    <rect width="250" height="90" rx="18" fill="#1d2b2a" stroke="#4FD1C5" stroke-width="1.5"/>
    <text x="20" y="36" fill="#E5E7EB" font-family="Arial" font-size="14" font-weight="700">Bot answers directly</text>
    <text x="20" y="58" fill="#9aa4ab" font-family="Arial" font-size="13">grounded in client docs</text>
  </g>

  <!-- escalation path -->
  <path d="M200 470 V 540 H 440" stroke="#F59E0B" stroke-width="2.5" fill="none" marker-end="url(#arrowE)"/>
  <text x="230" y="534" fill="#F59E0B" font-family="Arial" font-size="13">can't help → escalate</text>

  <g transform="translate(450,500)">
    <rect width="260" height="90" rx="18" fill="#2a2420" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="35" cy="45" r="16" fill="#232c30" stroke="#F59E0B" stroke-width="2"/>
    <path d="M27 45 L42 38 L37 53 Z" fill="#F59E0B"/>
    <text x="62" y="38" fill="#E5E7EB" font-family="Arial" font-size="14" font-weight="700">Telegram supervisor</text>
    <text x="62" y="58" fill="#9aa4ab" font-family="Arial" font-size="12">full transcript + reply bridge</text>
    <text x="62" y="76" fill="#9aa4ab" font-family="Arial" font-size="12">/done hands back to bot</text>
  </g>

  <!-- admin panel -->
  <g transform="translate(790,160)">
    <rect width="340" height="430" rx="16" fill="#1a2024" stroke="#3a4248" stroke-width="2"/>
    <text x="22" y="36" fill="#E5E7EB" font-family="Arial" font-size="16" font-weight="700">No-Code Admin</text>
    <rect x="22" y="56" width="296" height="48" rx="10" fill="#232c30"/>
    <text x="36" y="86" fill="#4FD1C5" font-family="Arial" font-size="14">📄 Upload knowledge files</text>
    <rect x="22" y="116" width="296" height="48" rx="10" fill="#232c30"/>
    <text x="36" y="146" fill="#4FD1C5" font-family="Arial" font-size="14">💬 Train bot via chat</text>
    <rect x="22" y="176" width="296" height="48" rx="10" fill="#232c30"/>
    <text x="36" y="206" fill="#4FD1C5" font-family="Arial" font-size="14">🗂 View conversations</text>
    <rect x="22" y="236" width="296" height="48" rx="10" fill="#232c30"/>
    <text x="36" y="266" fill="#4FD1C5" font-family="Arial" font-size="14">📊 Analytics &amp; usage</text>
    <text x="22" y="330" fill="#9aa4ab" font-family="Arial" font-size="13">Changes apply to the live</text>
    <text x="22" y="350" fill="#9aa4ab" font-family="Arial" font-size="13">system prompt instantly —</text>
    <text x="22" y="370" fill="#9aa4ab" font-family="Arial" font-size="13">no redeploy required.</text>
  </g>

  <g font-family="Arial" font-size="15" font-weight="600">
    <rect x="70" y="668" width="110" height="34" rx="17" fill="#232c30"/>
    <text x="88" y="690" fill="#4FD1C5">FastAPI</text>

    <rect x="194" y="668" width="100" height="34" rx="17" fill="#232c30"/>
    <text x="212" y="690" fill="#4FD1C5">Gemini</text>

    <rect x="308" y="668" width="150" height="34" rx="17" fill="#232c30"/>
    <text x="324" y="690" fill="#4FD1C5">SQLite + NumPy</text>

    <rect x="472" y="668" width="170" height="34" rx="17" fill="#232c30"/>
    <text x="488" y="690" fill="#4FD1C5">Telegram / Messenger</text>
  </g>
</svg>
